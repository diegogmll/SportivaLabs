<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Competencia deportiva UPSLP</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    min-height:100vh;

    background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
    url('https://www.upslp.edu.mx/upslp/wp-content/uploads/2023/09/DJI_0619.jpg');

    background-size:cover;
    background-position:center;

    padding:40px;
}

.titulo{
    text-align:center;
    color:white;
    margin-bottom:40px;
}

.titulo h1{
    color:#ff8c32;
    font-size:3rem;
    margin-bottom:10px;
}

.grid{

    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(300px,1fr));
    gap:30px;

}

.card{

    background:#0b1f3a;

    border-radius:25px;

    padding:30px;

    color:white;

    box-shadow:0 15px 35px rgba(0,0,0,0.4);

}

.card h2{
    text-align:center;
    margin-bottom:25px;
    color:#ff8c32;
    font-size:2rem;
}

.deporte{

    background:white;

    color:#0b1f3a;

    border-radius:18px;

    padding:18px;

    margin-bottom:18px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.deporte span{
    font-size:1.2rem;
    font-weight:bold;
}

.puntos{

    background:#ff8c32;
    color:white;

    width:55px;
    height:55px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:1.4rem;
    font-weight:bold;
}

.botones{

    text-align:center;
    margin-top:40px;

}

a{

    text-decoration:none;

    background:#ff8c32;

    color:white;

    padding:16px 28px;

    border-radius:14px;

    margin:10px;

    display:inline-block;

    font-weight:bold;

    transition:0.3s;

}

a:hover{
    transform:scale(1.05);
}

.powered{

    position:fixed;
    bottom:12px;
    right:15px;

    color:rgba(255,255,255,0.7);

    font-size:0.9rem;

}

</style>
</head>

<body>

<div class="titulo">

    <h1>Competencia Universitaria 2026</h1>
    <h3>Marcador Oficial Interuniversitario</h3>

</div>

<div class="grid">

    <div class="card">

        <h2>UPSLP</h2>

        <div class="deporte">
            <span>Futbol</span>
            <div class="puntos" id="u1f">0</div>
        </div>

        <div class="deporte">
            <span>Basquet</span>
            <div class="puntos" id="u1b">0</div>
        </div>

        <div class="deporte">
            <span>Atletismo</span>
            <div class="puntos" id="u1a">0</div>
        </div>

    </div>

    <div class="card">

        <h2>UASLP</h2>

        <div class="deporte">
            <span>Futbol</span>
            <div class="puntos" id="u2f">0</div>
        </div>

        <div class="deporte">
            <span>Basquet</span>
            <div class="puntos" id="u2b">0</div>
        </div>

        <div class="deporte">
            <span>Atletismo</span>
            <div class="puntos" id="u2a">0</div>
        </div>

    </div>

    <div class="card">

        <h2>Tec de Monterrey</h2>

        <div class="deporte">
            <span>Futbol</span>
            <div class="puntos" id="u3f">0</div>
        </div>

        <div class="deporte">
            <span>Basquet</span>
            <div class="puntos" id="u3b">0</div>
        </div>

        <div class="deporte">
            <span>Atletismo</span>
            <div class="puntos" id="u3a">0</div>
        </div>

    </div>

</div>

<div class="botones">

    <a href="admin.html">
        Administrar Puntajes
    </a>

    <a href="estadisticas.html">
        Ver Estadísticas
    </a>

</div>

<script>

function obtenerDatos(){

    return JSON.parse(localStorage.getItem("universidades")) || {

        upslp:{futbol:0, basquet:0, atletismo:0},
        uaslp:{futbol:0, basquet:0, atletismo:0},
        tec:{futbol:0, basquet:0, atletismo:0}

    };

}

function actualizar(){

    const d = obtenerDatos();

    document.getElementById("u1f").textContent = d.upslp.futbol;
    document.getElementById("u1b").textContent = d.upslp.basquet;
    document.getElementById("u1a").textContent = d.upslp.atletismo;

    document.getElementById("u2f").textContent = d.uaslp.futbol;
    document.getElementById("u2b").textContent = d.uaslp.basquet;
    document.getElementById("u2a").textContent = d.uaslp.atletismo;

    document.getElementById("u3f").textContent = d.tec.futbol;
    document.getElementById("u3b").textContent = d.tec.basquet;
    document.getElementById("u3a").textContent = d.tec.atletismo;

}

actualizar();

setInterval(actualizar,1000);

</script>

<div class="powered">
powered by SportivaLabs
</div>

</body>
</html>
