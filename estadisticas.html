<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<title>Estadísticas</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{

 background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
    url('https://www.upslp.edu.mx/upslp/wp-content/uploads/2023/09/DJI_0619.jpg');

    background-size:cover;
    background-position:center;
    color:white;
    font-family:Arial;

    padding:40px;

}

h1{
    text-align:center;
    color:#ff8c32;
    margin-bottom:40px;
}

.grafica{

    background:white;

    border-radius:20px;

    padding:25px;

    margin-bottom:40px;

}

.resumen{

    display:flex;
    justify-content:center;

}

.card{

    background:#0b1f3a;

    border-radius:20px;

    padding:30px;

    text-align:center;

    width:350px;

    box-shadow:0 0 15px rgba(0,0,0,0.4);

}

.numero{

    font-size:3rem;
    color:white;

    margin-top:15px;
}

h2{
    color:#ff8c32;
}

h3{
    margin-top:15px;
    color:white;
}

a{

    display:block;
    width:max-content;

    margin:30px auto;

    background:#ff8c32;

    color:white;

    padding:15px 25px;

    border-radius:12px;

    text-decoration:none;

}

.powered{

    position:fixed;
    bottom:12px;
    right:15px;

    color:rgba(255,255,255,0.7);

    font-size:0.9rem;

}

</style>
</head>

<body>

<h1>Estadísticas</h1>

<div class="grafica">

<canvas id="grafica"></canvas>

</div>

<div class="resumen">

    <div class="card">

        <h2>Universidad Líder</h2>

        <div class="numero" id="lider"></div>

        <h3 id="puntajeLider"></h3>

    </div>

</div>

<a href="index.html">
Volver
</a>

<script>

const datos = JSON.parse(localStorage.getItem("universidades")) || {

    upslp:{futbol:0, basquet:0, atletismo:0},
    uaslp:{futbol:0, basquet:0, atletismo:0},
    tec:{futbol:0, basquet:0, atletismo:0}

};

function total(u){

    return u.futbol + u.basquet + u.atletismo;

}

const puntosUPSLP = total(datos.upslp);
const puntosUASLP = total(datos.uaslp);
const puntosTEC = total(datos.tec);

let lider = "UPSLP";
let max = puntosUPSLP;

if(puntosUASLP > max){

    max = puntosUASLP;
    lider = "UASLP";

}

if(puntosTEC > max){

    max = puntosTEC;
    lider = "Tec de Monterrey";

}

document.getElementById("lider").textContent =
lider;

document.getElementById("puntajeLider").textContent =
max + " puntos acumulados";

new Chart(document.getElementById("grafica"),{

    type:'bar',

    data:{

        labels:['UPSLP','UASLP','TEC'],

        datasets:[

            {
                label:'Futbol',
                data:[
                    datos.upslp.futbol,
                    datos.uaslp.futbol,
                    datos.tec.futbol
                ]
            },

            {
                label:'Basquet',
                data:[
                    datos.upslp.basquet,
                    datos.uaslp.basquet,
                    datos.tec.basquet
                ]
            },

            {
                label:'Atletismo',
                data:[
                    datos.upslp.atletismo,
                    datos.uaslp.atletismo,
                    datos.tec.atletismo
                ]
            }

        ]

    },

    options:{
        responsive:true
    }

});

</script>

<div class="powered">
powered by SportivaLabs
</div>

</body>
</html>
